- id: fhir
  name: FHIR
  conforms: false
  evidence: Out of market — Tailor sells retail/e-commerce/manufacturing ERP.
domain_standard_summary:
  market: ERP / retail operations
  finding: >-
    Retail ERP has no single dominant machine-readable interchange standard the way
    banking has ISO 20022 or healthcare has HL7. Tailor's one contract-declared domain
    standard is SCIM 2.0 for enterprise identity provisioning. EDI (X12/EDIFACT) is the
    standard a retail/manufacturing ERP buyer would look for next and Tailor declares
    none — integration to Shopify, QuickBooks, Odoo and ShipStation is done with
    per-vendor connectors instead.
