name: Tailor AppShell UI components
description: >-
  Tailor publishes AppShell, a first-party React application framework for building the
  front end of an ERP application on Tailor Platform. It ships 36 documented components,
  19 hooks and helpers, file-based routing, theming and a live hosted catalogue. This is
  distinct from the SDKs in packages/ — AppShell is the client-side rendering layer, not
  an API client.
