concepts:
- name: Authentication
  detail: OAuth2/OIDC AuthProvider component wired to the application's Auth service.
- name: File-based routing
  detail: Pages defined by directory structure via the Vite plugin instead of explicit module configuration.
- name: Modules and resources
  detail: Application structure that drives automatic routing, navigation and breadcrumbs.
- name: Styling and theming
  detail: Tailwind CSS v4, with a tiered theme token system and a hosted theme generator.
- name: AI in the UI
  detail: createAIGatewayClient and useAIChat wire AppShell components to the workspace AI Gateway using AppShell authentication.
