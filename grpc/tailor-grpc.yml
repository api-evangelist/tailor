name: Tailor Platform Protocol Buffers
description: >-
  Tailor publishes the full control-plane contract for the Tailor Platform as Protocol
  Buffers in the tailor-inc/proto repository, and mirrors the module on the Buf Schema
  Registry at buf.build/tailor-inc/tailor. The APIs are served over ConnectRPC, so the
  same definitions are callable as both gRPC and plain HTTP. This is Tailor's
  machine-readable API contract; the company publishes no OpenAPI/Swagger description.
ownership:
  justification: >-
    The proto repository lives in the tailor-inc GitHub organization, is linked as the
    canonical API definition from Tailor's own developer docs at
    docs.tailor.tech/reference/api/api-references, and its README links back to
    https://www.tailor.tech/ and https://docs.tailor.tech/. Different org name
    (tailor-inc vs tailor-platform) is Tailor's own split: tailor-inc holds the
    protocol/schema repos, tailor-platform holds the client tooling, and the
    tailor-platform SDK/tailorctl/terraform-provider repos are named in the proto
    README as the official client libraries for these definitions.
  hosts:
  - github.com/tailor-inc/proto
  - buf.build/tailor-inc/tailor
