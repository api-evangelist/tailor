aid: tailor
name: Tailor
description: >-
  Tailor Technologies builds Tailor Platform, a headless, API-first ERP for retail,
  e-commerce and manufacturing operators. Its control plane is exposed as a single
  254-RPC ConnectRPC service published as Protocol Buffers, and every application built
  on it gets an automatically generated GraphQL API over TailorDB with resolvers,
  pipelines, executors, workflows, an auth service and an OpenAI-compatible AI Gateway.
  The company ships a TypeScript SDK, a CLI, a Terraform provider, a React application
  framework (AppShell) and a first-party MCP server, and publishes llms.txt on both its
  marketing and documentation hosts. Tailor is a Y Combinator (S22) company and has
  raised $37M through Series A.
image: https://www.tailor.tech/og.jpg
