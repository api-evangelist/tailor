- name: Tailor Application GraphQL API
  description: >-
    The Tailor data plane. TailorDB generates a full GraphQL API from each application's
    schema — queries, mutations, filtering, sorting, Relay-style cursor pagination and
    aggregation — extended by custom resolvers, pipeline resolvers and functions. Each
    deployed application is provisioned its own endpoint on Tailor's erp.dev application
    domain, with an embedded GraphQL Playground in the console.
  humanURL: https://docs.tailor.tech/getting-started/graphql
  baseURL: https://{APP_NAME}-{WORKSPACE_HASH}.erp.dev/query
  x-base-url-rationale: >-
    Templated on purpose, and on a domain other than tailor.tech. Tailor runs the
    application data plane on erp.dev, a domain it controls, and its own docs publish
    this exact form: "Navigate to your application's GraphQL playground at
    https://{APP_NAME}-{WORKSPACE_HASH}.erp.dev/query"
    (docs.tailor.tech/tutorials — Function deployment), alongside
    https://{YOUR_APP_SUBDOMAIN}.erp.dev/oauth2/token. Each customer application is
    provisioned its own host, so no single literal base exists. Left templated
    deliberately; do not replace it with api.tailor.tech, which is the control plane and
    a different API.
  tags:
  - Data Plane
  - GraphQL
  - TailorDB
  properties:
  - type: Documentation
    url: https://docs.tailor.tech/getting-started/graphql
  - type: Authentication
    url: authentication/tailor-authentication.yml
  - type: DataModel
    url: data-model/tailor-data-model.yml
- name: Tailor Executor Incoming Webhook API
  description: >-
    HTTP endpoints Tailor provisions for external systems to trigger executor operations
    inside a workspace. Accepts application/json and application/x-www-form-urlencoded,
    is rate limited to 100 requests per second per workspace, and returns RateLimit-Limit,
    RateLimit-Remaining and RateLimit-Reset headers with a 429 on exhaustion.
  humanURL: https://docs.tailor.tech/guides/executor/incoming-webhook-trigger
  baseURL: https://api.erp.dev
  x-base-url-rationale: >-
    api.erp.dev is Tailor's production application-plane API host, not a non-production
    environment — .dev is the TLD Tailor chose for the data plane. The full published
    endpoint form is
    https://api.erp.dev/v1/workspaces/{WORKSPACE_ID}/executors/{EXECUTOR_NAME}/invokeIncomingWebhook/{WEBHOOK_SECRET}
    (docs.tailor.tech/tutorials/setup-executor/incoming-webhook-trigger). Host probed
    2026-08-29: HTTP 200.
  tags:
  - Webhook
  - Event
  - Integration
  tags_raw:
  - Webhooks
  - Events
  - Integration
  properties:
  - type: Webhooks
    url: asyncapi/tailor-webhooks.yml
  - type: RateLimits
    url: rate-limits/tailor-rate-limits.yml
  - type: Documentation
    url: https://docs.tailor.tech/guides/executor/incoming-webhook-trigger
