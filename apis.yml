    note: >-
      302 to /login?redirectTo=%2F and serves the Tailor Platform Console SPA. The shared
      pointer-liveness probe grades this "dead" because the console answers 200 for a
      nonsense control path too — an SPA catch-all, not a soft-404 of this page. Verified
      by hand: the login surface is real. Kept as the SignUp/Login pointer.
  - url: https://api.tailor.tech
    status: 200
  - url: https://api.erp.dev
    status: 200
  pointers_not_emitted:
  - type: StatusPage
    reason: >-
      tailortech.statuspage.io — the status page Tailor's own security docs send
      customers to — reports "Page Inactive" and its API returns 401 "Your page is
      inactive". status.tailor.tech serves only the Statuspage app shell with every data
      endpoint 403. See lifecycle/tailor-lifecycle.yml.
  - type: TermsOfService
    reason: >-
      No terms page exists. /terms, /terms-of-service, /terms-of-use and /legal all 404,
      and the sitemap's 25 URLs contain no terms page. Only a privacy policy is published.
  - type: Pricing
    reason: /pricing 404s and no pricing page appears in the sitemap or either llms.txt. See plans/tailor-plans-pricing.yml.
  - type: Idempotency
    reason: >-
      109 of 254 control-plane RPCs declare `idempotency_level = NO_SIDE_EFFECTS`, which
      is real machine-readable safe-retry metadata — but it covers reads only. No RPC
      declares IDEMPOTENT, no Idempotency-Key header exists, and "idempoten" appears zero
      times in Tailor's 2MB documentation corpus. Emitting the pointer would assert write
      idempotency Tailor does not provide. Recorded honestly in conventions/ instead.
  - type: AgentCard
    reason: >-
      /.well-known/agent-card.json and /.well-known/agent.json 404 on every Tailor host
      except console.tailor.tech, which answers 200 with its SPA shell for every path.
      No A2A card is published. Search-only artifact — nothing written.
  - type: Roadmap
    reason: No public roadmap page found on tailor.tech, docs.tailor.tech or the GitHub organization.
  - type: Postman
    reason: No public Postman collection or workspace found. The API is gRPC/Connect and GraphQL, not REST.
