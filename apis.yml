apis:
- name: Tailor Platform Operator API
  description: >-
    The Tailor Platform control plane. A single tailor.v1.OperatorService with 254 RPCs
    covering organizations, folders, teams, access grants, IP restrictions, workspaces,
    applications and every platform component — TailorDB, Auth, IdP, Resolver/Pipeline,
    Executor, Function, Workflow, StateFlow, Secret Manager, Static Website, AI Gateway,
    Telemetry Router and HTTP Adapter. Served over ConnectRPC, so callable as gRPC or
    plain HTTP. Authenticated with a Bearer personal access token or platform OAuth 2.0.
  humanURL: https://docs.tailor.tech/reference/api/api-references
  baseURL: https://api.tailor.tech
  tags:
  - Control Plane
  - gRPC
  - Connect RPC
  - Protobuf
  tags_raw:
  - Control Plane
  - gRPC
  - ConnectRPC
  - Protobuf
  properties:
