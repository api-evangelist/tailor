  openapi_note: Tailor publishes no OpenAPI or Swagger description.
  protobuf: grpc/tailor-tailor-v1-service.proto
  protobuf_service: tailor.v1.OperatorService
  protobuf_transport: ConnectRPC (gRPC + HTTP)
  graphql: per-application, provisioned per workspace; there is no single public GraphQL endpoint to introspect
  graphql_gated: true
  mcp: local stdio via `npx -y @tailor-platform/tailor-mcp mcp`
  mcp_gated: true
  mcp_gate_reason: requires a Tailor account and a tpp_ personal access token
