name: Tailor MCP tool to control-plane RPC crosswalk
description: >-
  Binds each published Tailor MCP tool to the OperatorService RPCs that back it. Tailor
  ships no OpenAPI, so the REST column is replaced by the Protobuf/ConnectRPC contract —
  OperatorService is reachable over both gRPC and HTTP, so these RPC names are the real
  callable operations an MCP tool dispatches to.
surfaces:
