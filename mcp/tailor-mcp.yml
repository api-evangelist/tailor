source: https://github.com/tailor-platform/tailor-mcp
name: Tailor Platform MCP Server
description: >-
  Tailor ships a first-party MCP server inside the tailorctl CLI. It is distributed as
  the npm installer @tailor-platform/tailor-mcp, which downloads the platform-appropriate
  tailorctl binary and runs it in MCP mode. There is no vendor-hosted remote endpoint —
  an operator installs and runs the server themselves, either over stdio or by starting
  the built-in HTTP transport on a host they control.
status: published
deployment:
  mode: local-stdio
  install: npx -y @tailor-platform/tailor-mcp mcp
  package: https://www.npmjs.com/package/@tailor-platform/tailor-mcp
  auth: api-key
  verified: searched
  note: >-
    Client config published in the repository README uses command "npx" with args
    ["-y", "@tailor-platform/tailor-mcp", "mcp"] and a TAILOR_TOKEN env var. The README
    also documents `npx tailorctl mcp --transport=http --listen=0.0.0.0:9000`, which is
    a SELF-HOSTED HTTP transport the operator starts, not a Tailor-operated URL. No
    endpoint field is recorded because Tailor publishes none.
authentication:
  method: Personal Access Token
  env_var: TAILOR_TOKEN
  token_prefix: tpp_
  obtain: npx @tailor-platform/tailor-mcp auth pat create --name mcp --scopes write --scopes read
  alternative: npx @tailor-platform/tailor-mcp auth login (credentials stored in ~/.tailorctl)
  scopes:
  - read
  - write
