    payloads themselves are documented only in prose.
gaps:
- No AsyncAPI document, so the 19 event types and their payloads are not machine-readable.
- No webhook signature or verification scheme is documented for outbound Executor webhooks.
- Inbound webhook authentication is a secret in the URL path rather than a signed header.
