name: Tailor event and webhook surface
description: >-
  Tailor has a real event surface with a published catalog of 19 named event types and
  their payload fields, but it publishes NO AsyncAPI document. Events are consumed inside
  the platform by Executors and Workflows rather than delivered to subscriber URLs — the
  outbound HTTP webhook is an Executor OPERATION the customer configures, so there is no
  provider-managed webhook subscription API and no signed-delivery contract to document.
asyncapi_published: false
