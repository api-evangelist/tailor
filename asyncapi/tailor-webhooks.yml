  searched:
  - github.com/tailor-platform (16 repos)
  - github.com/tailor-inc (4 repos)
  - docs.tailor.tech llms.txt and llms-full.txt
  result: no AsyncAPI document found
direction:
  inbound:
    name: Incoming Webhook Trigger
    docs: https://docs.tailor.tech/guides/executor/incoming-webhook-trigger
    endpoint: https://api.erp.dev/v1/workspaces/{WORKSPACE_ID}/executors/{EXECUTOR_NAME}/invokeIncomingWebhook/{WEBHOOK_SECRET}
    methods: [POST]
    content_types: [application/json, application/x-www-form-urlencoded]
    auth: shared secret embedded in the URL path
    rate_limit: 100 req/sec per workspace, 429 on exhaustion with RateLimit-* headers
    payload_envelope: '{ "args": { "method": ..., "headers": {...}, "body": {...} } }'
    note: >-
      Headers are exposed lowercase with hyphens and may be arrays. Form-urlencoded data
      is parsed into body with single values as strings and repeated values as arrays.
  outbound:
    name: Webhook Operation
    docs: https://docs.tailor.tech/guides/executor/webhook-operation
    methods: [POST]
    note: >-
      An Executor operation of kind "webhook" sends an HTTP POST to a URL the customer
      configures, with customer-defined headers and request body. Only POST is supported.
      Timeout 60s with retry up to 10 attempts. Outbound calls originate from Tailor's
      published regional egress IPs
      (docs.tailor.tech/reference/platform/outgoing-ip-addresses).
    signing: not-documented
    delivery_guarantee: at-least-once (up to 10 retry attempts on failure/timeout)
triggers:
- name: eventTrigger
  description: Fires an Executor operation when a platform event is published.
- name: incomingWebhookTrigger
  description: Exposes an HTTP endpoint external systems call to trigger an Executor operation.
- name: scheduleTrigger
  description: Fires an Executor operation on a schedule.
